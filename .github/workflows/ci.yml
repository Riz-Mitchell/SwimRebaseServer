name: CI

on:
  pull_request:
    branches:
      - master
      - 'releases/**'
      - 'hotfix/**'
  # Gives every master tip a passing build-and-test, which new releases/** and hotfix/** branches require to be created.
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SwimRebase.slnx

      - name: Build
        run: dotnet build SwimRebase.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SwimRebase.slnx -c Release --no-build
