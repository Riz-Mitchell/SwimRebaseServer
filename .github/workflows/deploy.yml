name: Deploy to Azure App Service

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      bicepParamFile:
        description: 'Bicep parameter file basename under infra/ (e.g. dev, prod)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SwimRebase.slnx

      - name: Publish REST
        run: >
          dotnet publish src/Presentation/REST/REST.csproj
          -c Release
          -o ${{ github.workspace }}/publish
          --no-restore

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision/update infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/${{ inputs.bicepParamFile }}.bicepparam

      - name: Set App Service application settings (Key Vault references)
        env:
          VAULT_URI: https://${{ vars.AZURE_VAULT_NAME }}.vault.azure.net
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "ConnectionStrings__AiDatabase", "value": "@Microsoft.KeyVault(SecretUri=${{ env.VAULT_URI }}/secrets/ConnectionStrings--AiDatabase/)", "slotSetting": false },
              { "name": "ConnectionStrings__AuthDatabase", "value": "@Microsoft.KeyVault(SecretUri=${{ env.VAULT_URI }}/secrets/ConnectionStrings--AuthDatabase/)", "slotSetting": false },
              { "name": "ConnectionStrings__TrainingDatabase", "value": "@Microsoft.KeyVault(SecretUri=${{ env.VAULT_URI }}/secrets/ConnectionStrings--TrainingDatabase/)", "slotSetting": false },
              { "name": "Supabase__Url", "value": "@Microsoft.KeyVault(SecretUri=${{ env.VAULT_URI }}/secrets/Supabase--Url/)", "slotSetting": false },
              { "name": "Anthropic__ApiKey", "value": "@Microsoft.KeyVault(SecretUri=${{ env.VAULT_URI }}/secrets/Anthropic--ApiKey/)", "slotSetting": false }
            ]

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish

      - name: Azure logout
        if: always()
        run: az logout || true
