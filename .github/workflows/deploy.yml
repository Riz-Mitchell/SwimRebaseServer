name: Deploy to Azure App Service

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SwimRebase.slnx

      - name: Publish REST
        run: >
          dotnet publish src/Presentation/REST/REST.csproj
          -c Release
          -o ${{ github.workspace }}/publish
          --no-restore

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set App Service application settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "ConnectionStrings__AiDatabase", "value": "${{ secrets.CONNECTIONSTRINGS_AIDATABASE }}", "slotSetting": false },
              { "name": "ConnectionStrings__AuthDatabase", "value": "${{ secrets.CONNECTIONSTRINGS_AUTHDATABASE }}", "slotSetting": false },
              { "name": "ConnectionStrings__TrainingDatabase", "value": "${{ secrets.CONNECTIONSTRINGS_TRAININGDATABASE }}", "slotSetting": false },
              { "name": "Supabase__Url", "value": "${{ secrets.SUPABASE_URL }}", "slotSetting": false },
              { "name": "Anthropic__ApiKey", "value": "${{ secrets.ANTHROPIC_APIKEY }}", "slotSetting": false }
            ]

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish

      - name: Azure logout
        if: always()
        run: az logout
