name: Deploy

# Merges to master deploy TST, then PRO once the pro environment is approved.
# Merges to releases/** and hotfix/** deploy TST only.
on:
  push:
    branches:
      - master
      - 'releases/**'
      - 'hotfix/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  tst:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: tst
      bicepParamFile: tst
    secrets: inherit

  pro:
    needs: tst
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: pro
      bicepParamFile: pro
    secrets: inherit
